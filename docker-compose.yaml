services:
    postgres:
        image: postgres:18
        restart: unless-stopped
        environment:
            - POSTGRES_USER=monolith
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=monolith
        networks:
            - monolith
        volumes:
            - /var/lib/postgresql/data:/var/lib/postgresql/data
    redis:
        image: redis:8
        restart: unless-stopped
        networks:
            - monolith
    server:
        build: .
        container_name: monolith-server
        restart: unless-stopped
        depends_on:
            - redis
            - postgres
        environment:
            - TOKEN=${TOKEN}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        networks:
            - monolith
    monolith:
        build: ./web
        container_name: monolith
        restart: unless-stopped
        ports:
            - "8000:8000"
        depends_on:
            - server
        networks:
            - monolith
networks:
    monolith:
        driver: bridge
